<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TB my Coach"><link rel="icon" href="favicon.ico"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#11182A"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --chalk:#EEF1F4; --paper:#FFFFFF; --ink:#18212C; --soft:#5B6673; --line:#D7DDE3;
  --blue:#1F4FB5; --yellow:#E9AE00; --red:#C8202B; --green:#1E8F4E; --steel:#8A96A3; --black:#1B1B1B;
  --input:#FFF7D6; --forced:#FCD9C4; --bad:#FFD3D3; --good:#D9F2E3; --warn:#FFF0C2;
  --r:12px; --font:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--chalk:#12171D;--paper:#1B222B;--ink:#E8EDF2;--soft:#9AA6B2;--line:#2C3642;--input:#3A3417;--forced:#4A2E1E;--bad:#4A1F22;--good:#173826;--warn:#3F3514;}}
:root[data-theme="dark"]{--chalk:#12171D;--paper:#1B222B;--ink:#E8EDF2;--soft:#9AA6B2;--line:#2C3642;--input:#3A3417;--forced:#4A2E1E;--bad:#4A1F22;--good:#173826;--warn:#3F3514;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--chalk);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-text-size-adjust:100%}
body{padding-bottom:84px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--paper);padding:10px 14px 8px}
header.top h1{font-family:var(--cond);font-weight:700;font-size:1.45rem;letter-spacing:.01em;margin:0;line-height:1.1}
header.top .sub{font-size:.8rem;opacity:.75;margin-top:2px}
.role{float:right;font-family:var(--cond);font-size:.85rem;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 10px;background:transparent;color:inherit}
main{padding:12px;max-width:760px;margin:0 auto}
h2{font-family:var(--cond);font-weight:700;font-size:1.35rem;margin:18px 2px 8px}
h3{font-family:var(--cond);font-weight:600;font-size:1.1rem;margin:12px 0 6px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:10px 0}
.muted{color:var(--soft);font-size:.85rem}
.small{font-size:.8rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--soft);flex:1 1 130px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:8px;padding:8px 9px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
input.calc{background:transparent;border-color:transparent}
button{font:inherit;font-family:var(--cond);font-weight:600;font-size:1rem;border:0;border-radius:10px;padding:9px 14px;background:var(--ink);color:var(--paper);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.weeks{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.wk{flex:0 0 auto;scroll-snap-align:center;min-width:52px;text-align:center;border-radius:10px;border:2px solid var(--line);background:var(--paper);padding:5px 6px 4px;font-family:var(--cond);cursor:pointer;color:var(--ink)}
.wk b{display:block;font-size:1.05rem;line-height:1}
.wk span{font-size:.68rem;color:var(--soft)}
.wk.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.wk.on span{color:var(--paper);opacity:.8}
.ph-Accumulation{--pc:var(--blue)} .ph-Transmutation{--pc:var(--yellow)} .ph-Réalisation{--pc:var(--red)} .ph-Deload{--pc:var(--green)} .ph-Test{--pc:var(--black)} .ph-Transition{--pc:var(--steel)}
.wk[class*="ph-"]{border-bottom:6px solid var(--pc)}
.plate{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--pc,var(--line));vertical-align:-1px;margin-right:6px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.ses{border-left:6px solid var(--ink)}
.ses h3{margin:0 0 2px}
.ex{padding:10px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.exn{font-weight:600}
.ss{display:inline-block;min-width:22px;text-align:center;font-family:var(--cond);font-weight:700;background:var(--ink);color:var(--paper);border-radius:6px;padding:0 5px;margin-right:6px;font-size:.85rem}
.presc{font-family:var(--cond);font-size:1.12rem;line-height:1.3;margin-top:3px}
.presc .ld{font-weight:700}
.bad{background:var(--bad)!important}
.forced{background:var(--forced)!important}
.chip{display:inline-block;font-family:var(--cond);font-size:.8rem;border-radius:999px;padding:2px 9px;background:var(--chalk);border:1px solid var(--line);margin:2px 4px 2px 0;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.alert{padding:9px 10px;border-radius:9px;margin:6px 0;font-size:.92rem}
.alert.ok{background:var(--good)} .alert.ko{background:var(--warn)} .alert.x{background:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px}
.kpi b{display:block;font-family:var(--cond);font-size:1.5rem;line-height:1.1}
.kpi span{font-size:.72rem;color:var(--soft)}
@media (max-width:420px){.kpis{grid-template-columns:repeat(2,1fr)}}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--cond);font-weight:600;color:var(--soft);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.grid-sim td{text-align:center;font-family:var(--cond);font-size:1rem}
.grid-sim td.b{font-weight:700}
.wkedit{display:flex;gap:6px;overflow-x:auto;padding:6px 0 4px;-webkit-overflow-scrolling:touch}
.wkedit .cell{flex:0 0 190px}
.wkedit .cell .lab{font-family:var(--cond);font-size:.78rem;color:var(--soft);display:flex;justify-content:space-between}
.wkedit input{font-size:15px;padding:7px 8px}
.wkedit input::placeholder{color:var(--soft);opacity:.9}
.decode{font-size:.85rem;color:var(--soft);margin-top:4px}
details>summary{cursor:pointer;font-family:var(--cond);font-weight:600;font-size:1.05rem;padding:4px 0;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"＋ ";color:var(--soft)}
details[open]>summary::before{content:"－ "}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{flex:1;background:transparent;color:var(--soft);padding:6px 2px;border-radius:8px;font-size:.92rem;font-weight:600}
nav.tabs button.on{color:var(--ink);background:var(--chalk)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{padding:16px 10px;font-size:1.1rem;background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.sv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bigload{font-family:var(--cond);font-weight:700;font-size:1.25rem}
.warm td{font-family:var(--cond);font-size:1rem}
.note{font-size:.8rem;color:var(--soft);margin:6px 2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:10px;font-size:.9rem;z-index:40;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
svg text{font-family:var(--cond)}

/* ===== nutrition & business */
.mb{margin:7px 0}.mb-h{display:flex;justify-content:space-between;font-size:.82rem;color:var(--soft)}.mb-h b{color:var(--ink);font-family:var(--cond);font-size:1.02rem}
.mb-t{height:8px;background:var(--chalk);border-radius:99px;overflow:hidden}.mb-t i{display:block;height:100%;background:var(--green);border-radius:99px}.mb-t i.over{background:var(--yellow)}
.mb3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kc{font-family:var(--cond);font-size:2.4rem;font-weight:700;line-height:1;margin-right:6px}
.meal{border-left:6px solid var(--line)}.meal.done{border-left-color:var(--green)}.meal.alt{border-left-color:var(--blue)}.meal.skip{border-left-color:var(--steel);opacity:.8}
.its{margin:6px 0 10px;padding:0;list-style:none;font-size:.92rem}.its li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line)}.its li span:last-child{color:var(--soft);white-space:nowrap}
.acts{display:flex;gap:6px;flex-wrap:wrap}.acts button{flex:1 1 auto}
button.ok{background:var(--green);color:#fff}button.sm{padding:6px 10px;font-size:.9rem}button:disabled{opacity:.45;cursor:default}
.opt{padding:10px 0 4px;border-top:1px solid var(--line);margin-top:8px}
.edit{background:var(--chalk);border-radius:10px;padding:10px;margin-top:8px}
.tag{font-family:var(--cond);font-size:.78rem;border-radius:6px;padding:1px 7px;background:var(--ink);color:var(--paper);white-space:nowrap}.tag.alt{background:var(--steel)}
.res{max-height:280px;overflow:auto}.res button{display:block;width:100%;text-align:left;background:var(--paper);color:var(--ink);border:1px solid var(--line);margin:5px 0;font-family:var(--font);font-weight:500;font-size:.94rem}
.dayrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dayrow label{display:flex;flex-direction:column;gap:2px;font-size:.75rem;text-align:center;color:var(--soft);font-family:var(--cond)}.dayrow select{padding:6px 1px;font-size:13px}
label.shop.got span{text-decoration:line-through;color:var(--soft)}
.inv{background:#fff;color:#111;border:1px solid var(--line);border-radius:var(--r);padding:22px;font-size:.92rem;line-height:1.45}
.inv table{margin:18px 0 10px}.inv th,.inv td{border-bottom:1px solid #ccc;color:#111}.inv td.n{white-space:nowrap}.inv .muted{color:#555}
.inv-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.inv-brand{font-family:var(--cond);font-size:1.4rem;font-weight:700}.inv-t{font-family:var(--cond);font-size:1.7rem;font-weight:700}
.inv-cl{margin-top:20px;padding:10px 12px;border:1px solid #ccc;border-radius:8px;max-width:320px}.inv-tot{text-align:right;font-family:var(--cond);font-size:1.3rem;font-weight:700;margin:6px 0}
@media (max-width:420px){nav.tabs button{font-size:.8rem;padding:6px 1px}.mb3{gap:6px}}
.feel{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}.feel>span{font-size:.92rem}
.dots{display:flex;gap:5px}.dot{width:34px;height:34px;padding:0;border-radius:50%;background:var(--chalk);color:var(--ink);border:1px solid var(--line);font-size:.95rem}.dot.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.catgrid button{background:var(--paper);color:var(--ink);border:1px solid var(--line);text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.95rem;padding:12px}.catgrid span{color:var(--soft);font-family:var(--font);font-size:.82rem}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cx{border-top:1px solid var(--line);padding:10px 0;background:var(--paper)}.cx.dragging{position:relative;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.25);border-radius:10px;opacity:.95}
.cx-h{display:flex;align-items:center;gap:8px}.drag{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:1.3rem;padding:4px 8px;color:var(--soft)}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);font-family:var(--cond);font-weight:700;font-size:1.08rem;text-align:left;cursor:pointer}
.rest{color:var(--blue);font-size:.85rem;margin-top:4px}
table.sets{width:100%;margin-top:6px}table.sets th{font-size:.72rem;text-transform:uppercase;color:var(--soft)}table.sets td{padding:3px 2px;vertical-align:middle}
table.sets input.si{width:100%;min-width:44px;padding:7px 4px;text-align:center;font-size:16px}table.sets tr.done td{background:color-mix(in srgb,var(--green) 18%,transparent)}
.sn{display:inline-block;min-width:24px;text-align:center;font-family:var(--cond);font-weight:700}
.chk{width:38px;height:36px;padding:0;background:var(--chalk);color:var(--soft);border:1px solid var(--line)}.chk.on{background:var(--green);color:#fff;border-color:var(--green)}
#restbar{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--paper);padding:8px 12px 10px}
#restbar .rb-t{font-family:var(--cond);font-size:1.6rem;font-weight:700}#restbar .rb-p{height:4px;background:rgba(255,255,255,.2);border-radius:9px;margin-bottom:6px;overflow:hidden}#restbar .rb-p i{display:block;height:100%;background:var(--blue)}
#restbar button.ghost{color:var(--paper);border-color:rgba(255,255,255,.4)}
#offbar{position:fixed;left:0;right:0;top:0;z-index:60;background:var(--yellow);color:#111;font-size:.82rem;padding:6px 12px;text-align:center}
#pr-pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.2);font-size:5rem;opacity:0;pointer-events:none;z-index:70;transition:all .5s cubic-bezier(.2,1.6,.4,1)}#pr-pop.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.streak{display:inline-block;margin:-4px 0 8px;font-family:var(--cond);font-weight:700;color:var(--red)}
.ovr{flex-wrap:nowrap!important;align-items:flex-start}.ovr .dot{margin-top:5px}.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}.dot.l0{background:var(--green)}.dot.l1{background:var(--yellow)}.dot.l2{background:var(--red)}
.demo{font-size:.82rem;color:var(--blue);text-decoration:none;font-weight:600}
.printdoc h3.pw{margin:18px 0 6px;border-bottom:2px solid var(--ink)}table.pt{width:100%;margin:6px 0 10px;border-collapse:collapse}table.pt th{text-align:left;background:var(--chalk);padding:6px}table.pt td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.9rem}
#msgfab{position:fixed;right:14px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:45;width:54px;height:54px;border-radius:50%;padding:0;font-size:1.5rem;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#msgfab .badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:.75rem;min-width:20px;height:20px;border-radius:10px;line-height:20px;font-family:var(--font)}
#msgpanel{position:fixed;inset:0;z-index:80;background:var(--bg,var(--chalk));display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}#msgpanel[hidden]{display:none}
.mp-h{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--ink);color:var(--paper)}.mp-h .ghost{color:var(--paper);border-color:rgba(255,255,255,.4)}
.mp-l{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.mp-c{padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line)}
.msg{max-width:82%;padding:8px 10px;border-radius:14px;font-size:.95rem;line-height:1.35}.msg.me{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:4px}.msg.them{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.mbody{white-space:pre-wrap;word-wrap:break-word}.mt{font-size:.7rem;opacity:.65;margin-top:3px;text-align:right}.mref{font-size:.75rem;font-weight:600;opacity:.8;margin-bottom:3px}
.mdel{background:none;border:0;color:inherit;opacity:.6;padding:0 2px;font-size:.75rem;cursor:pointer}
.mmedia{display:block;max-width:100%;max-height:320px;border-radius:10px;margin:2px 0 4px}.mph{width:100%;aspect-ratio:3/4;background:var(--chalk);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--soft)}
.attach{display:flex;align-items:center;justify-content:center;width:42px;height:40px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:1.2rem}
body.mp-on{overflow:hidden}
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.phslot{aspect-ratio:3/4;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;color:var(--soft);font-size:.85rem}.phslot img{width:100%;height:100%;object-fit:cover}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}.cmp span{display:block;text-align:center;font-size:.8rem;color:var(--soft)}
@media (pointer:coarse){input,select,textarea{font-size:16px!important}}
.sessbar{display:flex;align-items:center;gap:10px;margin:8px 0;padding:10px;border-radius:12px;background:var(--chalk)}.sessbar.live{background:var(--ink);color:var(--paper);position:sticky;top:6px;z-index:20;box-shadow:0 6px 16px rgba(0,0,0,.2)}.sessbar.live button{background:var(--green);color:#fff}.sessbar.live .muted{color:rgba(255,255,255,.7)}.sessbar.done{border:1px solid var(--green)}
.stimer{font-family:var(--cond);font-size:1.8rem;font-weight:700;line-height:1.1}
#toast,.toast{z-index:120!important;pointer-events:none}
#restbar .row{flex-wrap:nowrap;gap:8px}#restbar button{min-width:56px;min-height:42px;font-size:1rem}
button,[data-act]{touch-action:manipulation}
body.rest-on #msgfab{display:none}
header.top h1{display:flex;align-items:center;gap:8px}header.top h1::before{content:'';width:30px;height:30px;flex:0 0 30px;border-radius:8px;background:url(logo.png) center/cover}
@media print{#msgfab,#msgpanel{display:none!important}}
@media print{.printdoc{color:#000}table.pt tr{break-inside:avoid}#restbar,#offbar{display:none!important}}
@media print{header.top,nav.tabs,.noprint,.toast{display:none!important}:root{padding:0}html,body{background:#fff}body{padding:0}main{max-width:none;padding:0}.inv{border:0;padding:0}}
</style>

<body>
<header class="top"><button class="role" id="roleBtn" hidden></button><h1 id="appTitle">TB my Coach</h1><div class="sub" id="appSub">Chargement…</div></header>
<main id="app"><div class="card">Chargement du programme…</div></main>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  RATES:{"Débutant":[0.04,0.06,0.04],"Intermédiaire":[0.015,0.025,0.02],"Avancé":[0.006,0.01,0.008],"Élite":[0.0025,0.005,0.004]},

const BASEMAP={}; LIB.BASE.forEach(r=>BASEMAP[r[0]]={mP:r[1],s1:r[2],s2:r[3],eq:r[4],sch:r[5],cost:r[6]});

const num=v=>(v===""||v===null||v===undefined||isNaN(+v))?null:+v;
const round=(x,d=0)=>{const p=10**d;return Math.round(x*p+1e-9)/p};
function bar(r,rpe){r=Math.min(20,Math.max(1,Math.round(r)));const j=RPES.indexOf(Math.min(10,Math.max(5,Math.round(rpe*2)/2)));return LIB.SEQ[2*(r-1)+j]/100;}
function estRPE(r,pu){r=Math.min(20,Math.max(1,Math.round(r)));let best=null;for(const rp of RPES){if(bar(r,rp)>=pu-1e-9) best=rp;}return best===null?10.5:best;} // plus petit RPE atteignant pu
function roundPas(x,pas){return Math.round(x/pas+1e-9)*pas;}

// ---------- parseur de prescription
function normalize(s){
  if(s===null||s===undefined) return "";
  let t=String(s).toUpperCase().replace(/×/g,"X").replace(/,/g,".").replace(/@/g," ").replace(/\s+/g," ").trim();
  for(const [a,b] of [[" +","+"],["+ ","+"],[" X","X"],["X ","X"],["RPE ","RPE"],["RIR ","RIR"],[" %","%"],[" -","-"],["- ","-"]]) t=t.split(a).join(b);
  return t.replace(/ /g,"@");
}
function parseBlock(bs){
  const xp=bs.indexOf("X"); const o={bs,ok:true,sets:null,rt:"",rlo:null,pct:null,rpe:null,pu:null};
  if(xp<1){o.ok=false;return o;}
  const sS=bs.slice(0,xp); o.sets=/^\d+$/.test(sS)?+sS:null;
  const aft=bs.slice(xp+1)+"@"; o.rt=aft.slice(0,aft.indexOf("@"));
  const lo=o.rt.split("-")[0]; o.rlo=/^\d+(\.\d+)?$/.test(lo)?+lo:null;
  if(bs.includes("%")){const pre=bs.slice(0,bs.indexOf("%"));const n=pre.split("@").pop().trim();o.pct=/^\d+(\.\d+)?$/.test(n)?+n:NaN;}
  const tok=t=>{const m=bs.slice(bs.indexOf(t)+3)+"@";const x=m.slice(0,m.indexOf("@"));return /^\d+(\.\d+)?$/.test(x)?+x:NaN;};
  if(bs.includes("RPE")) o.rpe=tok("RPE"); else if(bs.includes("RIR")) o.rpe=10-tok("RIR");
  const kgt=bs.split("@").find(x=>/^\d+(\.\d+)?KG$/.test(x)); o.kg=kgt?parseFloat(kgt):null;
  const ntok=bs.split("@").length, known=1+(bs.includes("%")?1:0)+((bs.includes("RPE")||bs.includes("RIR"))?1:0)+(kgt?1:0);
  if(!(o.sets>=1)||!(o.rlo>=1)||Number.isNaN(o.pct)||Number.isNaN(o.rpe)||ntok!==known) o.ok=false;
  if(o.ok){ if(o.pct!==null) o.pu=o.pct/100; else if(o.rpe!==null) o.pu=bar(o.rlo,o.rpe); }
  return o;
}
function parsePrescription(s){
  const N=normalize(s); if(!N) return {empty:true,valid:true,blocks:[]};
  const parts=N.split("+").map(x=>x.trim()).filter(x=>x!=="").slice(0,4);
  const blocks=parts.map(parseBlock); return {empty:false,valid:blocks.every(b=>b.ok),blocks,raw:s};
}
const fmtN=x=>(x===null||x===undefined||isNaN(x))?"":(+x).toLocaleString("fr-FR",{maximumFractionDigits:2});
function loadText(v,type){ if(type==="Lesté"){ if(v===0) return "PDC"; if(v<0) return "PDC avec élastique ≈ "+fmtN(-v)+" kg"; return "PDC + "+fmtN(v)+" kg";} return fmtN(v)+(type==="Haltères"?" kg/haltère":" kg"); }

// ---------- 1RM
function sysAdd(type,pdc){return type==="Lesté"?pdc:0;}
function est1RM(t,pdc){ // système
  if(!t||!t.name) return null; const add=sysAdd(t.type,pdc);
  for(const n of [1,2,3,5,6,8,10,12]){const v=num(t.rm&&t.rm[n]); if(v!==null) return (v+add)/bar(n,10);}
  const pr=num(t.pdcreps); if(pr!==null&&t.type==="Lesté") return pdc/bar(Math.min(20,pr),10);
  return null;
}
function pot1RM(t,pdc){const add=sysAdd(t.type,pdc);let m=0;for(const n of [1,2,3,5,6,8,10,12]){const v=num(t.rm&&t.rm[n]);if(v!==null)m=Math.max(m,(v+add)/bar(n,10));}return m;}
function pasOf(t,P){ if(num(t.pas)!==null) return +t.pas; return t.type==="Haltères"?P.PDB:t.type==="Lesté"?P.PLES:t.type==="Machine"?P.PMAC:P.PBAR; }

// ---------- calcul principal
function compute(prog,carnet,suivi,today){
  const P=Object.assign({},DEFAULT_PARAMS,prog.params||{});
  const pdc=num(prog.profile.pdc)||75; const start=new Date(prog.profile.start+"T00:00:00");
  const phases=(prog.phases||[]).slice(0,NW); while(phases.length<NW) phases.push("");
  const NSEM=Math.max(1,phases.filter(p=>p).length);
  const cw=Math.min(NSEM,Math.max(1,Math.floor(((today||new Date())-start)/864e5/7)+1));
  // phases : semaine dans la phase, n° de phase, n° de bloc
  const wip=[],kph=[],bloc=[]; let starts=0,accs=0;
  for(let w=0;w<NW;w++){const p=phases[w]; wip[w]=p?((w>0&&phases[w-1]===p)?wip[w-1]+1:1):null;
    if(p&&wip[w]===1&&p!=="Deload"&&p!=="Test"&&p!=="Transition") starts++;
    if(p&&wip[w]===1&&p==="Accumulation") accs++;
    kph[w]=p?Math.max(0,starts-1):null; bloc[w]=Math.max(1,accs);}
  const dateOf=w=>new Date(start.getTime()+7*(w-1)*864e5);
  // mouvements suivis
  const tracked=(prog.tracked||[]).slice(0,NT).map(t=>Object.assign({},t));
  const schemaRank={};
  tracked.forEach((t,i)=>{t.idx=i; t.est=est1RM(t,pdc); t.pas_=pasOf(t,P); t.sch=(BASEMAP[t.name]||{}).sch||""; t.fmt_=Math.max(1,num(t.fmt)||1);
    if(t.sch){schemaRank[t.sch]=(schemaRank[t.sch]||0)+1; t.key=t.sch+"#"+schemaRank[t.sch];}});
  const trackedByName={}; tracked.forEach(t=>{if(t.name&&!(t.name in trackedByName)) trackedByName[t.name]=t;});
  // carnet : e1RM des séries notées
  const cEntries=[]; // {w,s,i,ex,g,h,r,j,sys,fiable}
  // (rempli après avoir construit les lignes, car il faut le nom et le type de l'exercice)
  // références renfos
  const refs={}; (prog.refs||[]).forEach(r=>{ if(!r||!r.name) return; const g=num(r.charge),h=num(r.reps); if(g===null||h===null) return;
    const eq=(BASEMAP[r.name]||{}).eq; const type=eq==="Poids de corps"?"Lesté":eq==="Haltères"?"Haltères":"Barre";
    refs[r.name]={sys:(g+sysAdd(type,pdc))/bar(Math.min(20,h),num(r.rpe)===null?10:+r.rpe),type};});
  // split
  const days=prog.profile.days||[]; const NSES=Math.max(1,days.filter(Boolean).length);
  const splitNames=LIB.SPLITS.map(s=>s[0]); const conseille=AUTO_FOR[NSES]||"Full body 2j";
  const splitIn=prog.profile.split||"AUTO";
  const split=splitNames.includes(splitIn)?splitIn:conseille;
  const tpl=LIB.TPL[split]||[]; const src=prog.profile.source||"Générateur";
  const dayIdx=[]; days.forEach((d,i)=>{if(d) dayIdx.push(i);});
  const prio=(prog.profile.prio||[]).filter(Boolean); const avoid=(prog.profile.avoid||[]).filter(Boolean);
  const okx=x=>x&&!avoid.includes(x)&&(typeof eqAllowed!=="function"||eqAllowed(x,prog.profile));
  const pick=(opts,o)=>{const first=opts[o-1]; if(okx(first)) return first; for(const x of opts) if(okx(x)) return x; return "";};
  // placements du plan de fréquence
  const plan=[]; tracked.forEach((t,m)=>{ if(!t.name) return; ((prog.plan||{})[m]||[]).forEach(p=>{ if(p&&p.q&&num(p.s)) plan.push({name:t.name,q:p.q,s:+p.s,m}); }); });
  const planBySes={}; plan.forEach(p=>{(planBySes[p.s]=planBySes[p.s]||[]).push(p);});
  // table du générateur (texte par qualité × semaine)
  const QP={}; (prog.qpar||LIB.QPAR).forEach(q=>QP[q[0]+"|"+q[1]]=q);
  const gen={}; QUALS.forEach(q=>{gen[q]=[];for(let w=0;w<NW;w++){const p=phases[w];let txt="";
    if(p&&p!=="Test"&&p!=="Transition"){const r=QP[q+"|"+p]; if(r&&+r[2]>0){const d=Math.min(wip[w]-1,3), b=P.GBUMP*(bloc[w]-1);
      txt=r[2]+"x"+r[3]+"@"+round(+r[4]+ +r[5]*d+b,1)+"%"; if(+r[6]>0) txt+=" + "+r[6]+"x"+r[7]+"@"+round(+r[8]+ +r[9]*d+b,1)+"%";}}
    gen[q][w]=txt;}});
  // séances
  const sessions=[]; const rows=[];
  for(let s=0;s<NS;s++){
    const S=(prog.sessions||[])[s]||{ex:[]};
    const tname=(tpl[s]||[])[0];
    const name=S.name||(s<NSES?(tname||("Séance "+(s+1))):"");
    const day=S.day||(s<NSES&&dayIdx[s]!==undefined?DAYS[dayIdx[s]]:"");
    const dayOff=day?DAYS.indexOf(day):0;
    const sesObj={s,name,day,dayOff,rows:[]}; sessions.push(sesObj);
    const pl=(planBySes[s+1]||[]); const np=src==="Générateur"?pl.length:0;
    const accSlots=((tpl[s]||[])[1]||[]).filter(sl=>(CATMAP[sl[0]]||{}).type!=="Schéma");
    for(let i=0;i<NE;i++){
      const E=(S.ex||[])[i]||{};
      let cat="",opt=1,trole="ACC-3",qual="",sug="",cons="";
      if(src==="Générateur"){ if(i<np){qual=pl[i].q; sug=pl[i].name;} else {const sl=accSlots[i-np]; if(sl){cat=sl[0];opt=sl[1];trole=sl[2];cons=sl[3]||"";}} }
      else if(src==="Règle S1" && s<NSES){ const sl=((tpl[s]||[])[1]||[])[i]; if(sl){cat=sl[0];opt=sl[1];trole=sl[2];cons=sl[3]||"";} }
      let role="";
      if(!qual&&cat){ const C=CATMAP[cat]||{};
        if(cat.startsWith("PF")){const mu=prio[+cat.slice(2)-1]; const R=RECOMAP[mu]; sug=R?pick(R.d,opt):"";}
        else { let trk=""; if(C.type==="Schéma"){const t=tracked.find(t=>t.key===cat+"#"+opt); trk=t?t.name:"";}
          sug=trk||pick(C.d||[],opt); role=trk?trole:(trole.startsWith("ACC")?trole:"ACC-3"); }
        if(!role) role=trole.startsWith("ACC")?trole:"ACC-3"; }
      if(qual) role=qual;
      if(!E.name&&sug&&typeof eqAllowed==="function"&&!eqAllowed(sug,prog.profile)) sug=subFor(sug,prog.profile);
      const ex=E.name||sug;
      const t=trackedByName[ex]; const binfo=BASEMAP[ex]||{};
      const type=t?t.type:(binfo.eq==="Poids de corps"?"Lesté":binfo.eq==="Haltères"?"Haltères":binfo.eq==="Barre"?"Barre":"Machine");
      const pas=t?t.pas_:(type==="Haltères"?P.PDB:type==="Lesté"?P.PLES:type==="Barre"?P.PBAR:P.PMAC);
      const fm=t?t.fmt_:1;
      let s1def="";
      if(sug||E.name){ if(!role) role="ACC-3";
        if(qual) s1def=(phases[0]==="Test"&&qual==="LOURD")?("1x"+fm+"@RPE10"):gen[qual][0];
        else if(role==="Lourd") s1def=fm<=3?"1x1@90% + 3x3@80%":("1x"+fm+"@RPE8 + 2x"+(fm+2)+"@RPE7.5");
        else if(role==="Volume") s1def=fm<=3?"4x5@75%":("3x"+(fm+2)+"@RPE7.5");
        else if(role.startsWith("ACC")) s1def=(+role.slice(-1)+(prio.includes(binfo.mP)?1:0))+"x10-12 RIR2";
      }
      const row={s,i,key:s+"_"+i,E,ex,sug,role,qual,cons:E.note||cons,ss:E.ss||"",type,pas,t,binfo,s1def,mode:E.mode||"Auto",weeks:[]};
      rows.push(row); sesObj.rows.push(row);
    }
  }
  // carnet : e1RM
  const rowByKey={}; rows.forEach(r=>rowByKey[r.key]=r);
  Object.entries(carnet||{}).forEach(([k,v])=>{ const [w,s,i]=k.split("_").map(Number); const r=rowByKey[s+"_"+i]; if(!r||!r.ex) return;
    const g=num(v.g),h=num(v.h),rp=num(v.r); let sys=null,fiable=null;
    if(g!==null&&h!==null&&rp!==null){ sys=(g+sysAdd(r.type,pdc))/bar(Math.min(20,Math.max(1,h)),rp);
      fiable=r.t?(h<=Math.max(P.FREPS,r.t.fmt_+2)&&rp>=P.FRPE):(h<=15&&rp>=7);}
    cEntries.push({w,s,i,ex:r.ex,type:r.type,g,h,r:rp,j:v.j||"",sys,fiable}); });
  const bestCarnet=(ex,w)=>{let m=0;cEntries.forEach(c=>{if(c.ex===ex&&c.w<w&&c.fiable&&c.sys>m)m=c.sys;});return m||null;};
  // 1RM de travail par semaine (réajustements + mode Auto)
  const readj=(prog.readj||[]).filter(r=>r&&r.name&&num(r.w)&&num(r.v)!==null);
  tracked.forEach(t=>{ t.work=[]; if(t.est===null) return;
    for(let w=1;w<=NW;w++){ let adjW=0,adjV=null; readj.forEach(r=>{if(r.name===t.name&&+r.w<=w&&+r.w>=adjW){adjW=+r.w;adjV=+r.v;}});
      const base=adjW>0?adjV+sysAdd(t.type,pdc):t.est; let v=base;
      if(t.mode==="Auto"){ let lastw=0; cEntries.forEach(c=>{if(c.ex===t.name&&c.w<w&&c.fiable&&c.w>lastw)lastw=c.w;});
        if(lastw>adjW){let lv=0;cEntries.forEach(c=>{if(c.ex===t.name&&c.w===lastw&&c.fiable&&c.sys>lv)lv=c.sys;}); v=Math.max(P.AFL*base,lv);} }
      t.work[w]=v; } });
  // semaines de chaque ligne
  rows.forEach(r=>{
    const E=r.E; const w1raw=(E.weeks||{})[1]||"";
    const w1eff=w1raw||r.s1def; const p1=parsePrescription(w1eff);
    const dflt=(!E.name&&/%/.test(r.s1def))?2:0;
    const cv=x=>{const n=num(x); return n===null?null:(Math.abs(n)<1?n*100:n);};
    const stp=cv(E.step)??dflt, bmp=cv(E.bump)??dflt;
    for(let w=1;w<=NW;w++){
      if(E.off&&w>=+E.off){ r.weeks[w]={w,raw:"",eff:"",forced:false,off:true}; continue; } // supprimé du programme à partir de cette semaine
      const raw=(E.weeks||{})[w]||""; let eff="";
      const ph=phases[w-1];
      if(raw) eff=raw;
      else if(w===1) eff=r.s1def;
      else if(r.qual&&(!E.name||E.name===r.sug)&&r.mode!=="Manuel") eff=(ph==="Test"&&r.qual==="LOURD")?("1x"+(r.t?r.t.fmt_:1)+"@RPE10"):gen[r.qual][w-1];
      else if(r.ex&&w1eff&&r.mode!=="Manuel"&&ph&&ph!=="Test"&&ph!=="Transition"&&p1.valid){
        const dl=ph==="Deload";
        const ov=(prog.overload||{})[ph]||null, kk=wip[w-1]-1, vol=ov&&(ov.t==="volume"||ov.t==="mixte")&&!dl, inten=!ov||!ov.t||ov.t==="intensite"||ov.t==="mixte";
        eff=p1.blocks.map((b,bi)=>{let ns=dl?Math.ceil(b.sets*P.DLS):b.sets; if(vol&&bi===p1.blocks.length-1) ns=Math.min(num(ov.max)||ns+3,ns+Math.floor(kk/(num(ov.n)||1))); let t=ns+"x"+b.rt;
          if(b.pct!==null) t+="@"+round(b.pct+(inten?stp*kk:0)+bmp*(kph[w-1]-kph[0])-(dl?P.DLP:0),1)+"%";
          if(b.rpe!==null) t+=" RPE"+(dl?Math.max(5,b.rpe-P.DLR):Math.min(9.5,b.rpe+((ov&&ov.t&&inten)?0.5*kk:0))); return t;}).join(" + ");
      }

      if(r.ex&&eff){ const pp=parsePrescription(eff); wk.valid=pp.valid; wk.blocks=pp.blocks;
        // 1RM de base
        let base=null; if(r.t&&r.t.work&&r.t.work[w]) base=r.t.work[w]; else if(refs[r.ex]) base=refs[r.ex].sys; else base=bestCarnet(r.ex,w);
        wk.base=base; const add=sysAdd(r.type,pdc);
        let sets=0,s85=0,s90=0,time=0,inol=0,sp=0,swp=0,cn=0; const zones=[0,0,0,0]; const parts=[];
        pp.blocks.forEach((b,k)=>{ if(!b.ok) return;
          b.load=b.kg!=null?b.kg:((b.pu!==null&&base)?roundPas(base*b.pu-add,r.pas):null);
          b.re=b.rpe!==null?b.rpe:(b.pu!==null?estRPE(b.rlo,b.pu):8);
          sets+=b.sets*(b.re>=6.5?1:0.5);
          if(b.pu!==null){ if(b.pu>=0.85) s85+=b.sets; if(b.pu>=0.9) s90+=b.sets; sp+=b.sets*b.pu; swp+=b.sets;
            if(r.t) {inol+=b.sets*b.rlo/Math.max(1,100-100*b.pu); P.PRIL.forEach((z,zi)=>{if(b.pu>=z[0]&&b.pu<=z[1]) zones[zi]+=b.sets*b.rlo;});} }
          const tz=b.pu!==null?(b.pu>=0.85?P.T1:b.pu>=0.75?P.T2:(b.pu>=0.65?1:0.6)*P.T3):(b.rlo<=5?P.T1:b.rlo<=8?P.T2:P.T3);
          time+=b.sets*tz; cn+=b.sets*(0.5+0.125*(Math.min(10,b.re)-6));
          let txt=b.sets+" × "+b.rt.replace("-","–");
          if(b.load!==null) txt+=" @ "+loadText(b.load,r.type); else if(b.pct!==null) txt+=" @ ? (% sans 1RM : ajoute-le dans Athlète ou Outils)"; else txt+=" — charge à choisir, note-la";
          if(b.pu!==null) txt+=" ("+(b.pct!==null?fmtN(b.pct)+" %, ":(b.load!==null?Math.round(b.pu*100)+" %, ":""))+"RPE "+(b.rpe!==null?fmtN(b.rpe):"≈ "+(b.re>10?"10+":fmtN(b.re)))+")";
          parts.push(txt); });
        if(r.ss) time*=P.SSF;
        cn*=(num(r.binfo.cost)||2)/3.5;
        Object.assign(wk,{blocks:pp.blocks,sets,s85,s90,time,inol,sp,swp,cn,zones,text:wk.valid?parts.join("  ·  "):"⚠ format non reconnu : "+eff,
          tgtReps:pp.blocks[0]&&pp.blocks[0].rlo,tgtRPE:pp.blocks[0]&&pp.blocks[0].re!==undefined?Math.min(10,pp.blocks[0].re):null,
          load1:pp.blocks[0]?pp.blocks[0].load:null,noOneRM:wk.valid&&pp.blocks.some(b=>b.pct!==null&&b.load===null)});
      }
      r.weeks[w]=wk;
    }
  });
  // agrégats par semaine et séance
  const act=rows.filter(r=>r.ex);
  const W=[]; for(let w=1;w<=NW;w++){ const o={w,phase:phases[w-1],sets:0,s85:0,s90:0,inol:0,sp:0,swp:0,cn:0,ses:[]};
    sessions.forEach(S=>{ let ss=0,tt=0,s85=0; S.rows.forEach(r=>{const k=r.weeks[w]; if(k&&k.sets!==undefined){ss+=k.sets;tt+=k.time;s85+=k.s85;}}); o.ses.push({sets:ss,dur:ss>0?P.WU+tt:0,s85}); });
    act.forEach(r=>{const k=r.weeks[w]; if(k&&k.sets!==undefined){o.sets+=k.sets;o.s85+=k.s85;o.s90+=k.s90;o.inol+=k.inol;o.sp+=k.sp;o.swp+=k.swp;o.cn+=k.cn;}});

function controls(M,w){

  out.push(["% sans 1RM",no1?`⚠ ${no1} case(s) en % sur un exercice sans 1RM (ajoute-le dans Athlète, dans les références renfos, ou passe en RPE)`:"✓ Chaque % a un 1RM"]);
  const abs=M.tracked.filter(t=>t.name&&!M.act.some(r=>r.ex===t.name)).map(t=>t.name);
  out.push(["Mouvements suivis absents",abs.length?"⚠ Absents du programme : "+abs.join(" · "):"✓ Tous programmés"]);
  const Wk=M.W[w-1]; const dmin=+M.prog_dmin, dmax=+M.prog_dmax;
  const outDur=Wk.ses.map((x,i)=>({i,d:x.dur})).filter(x=>x.d>0);
  const bad=outDur.filter(x=>x.d>dmax+5||x.d<dmin-5);
  out.push(["Durées",(bad.length?`⚠ ${bad.length} séance(s) hors fourchette : `:`✓ Dans la fourchette ${dmin}-${dmax} min : `)+outDur.map(x=>`S${x.i+1} ${Math.round(x.d)} min`).join(" · ")]);
  const n85=Wk.ses.filter(x=>x.s85>P.A85).length;
  out.push(["Séries lourdes (≥ 85 %)",n85?`⚠ ${n85} séance(s) au-dessus de ${P.A85} séries ≥ 85 %`:`✓ Au plus ${P.A85} séries ≥ 85 % par séance`]);
  const low=M.prio.filter(m=>MUSMAP[m]&&M.vol[m][w]<MUSMAP[m].MEV).length, high=Object.keys(MUSMAP).filter(m=>M.vol[m][w]>MUSMAP[m].MRV);
  out.push(["Muscles",(low+high.length)?`⚠ ${low} prioritaire(s) sous le MEV, ${high.length} au-dessus du MRV${high.length?" ("+high.join(", ")+")":""}`:"✓ Prioritaires au-dessus du MEV, aucun muscle au-dessus du MRV"]);

  let npr=0; M.act.forEach(r=>{const k=r.weeks[w]; if(k&&k.zones) k.zones.forEach((z,zi)=>{if(z>P.PRIL[zi][3]) npr++;});});

  if(w>1){ const prev=M.act.filter(r=>r.weeks[w-1]&&r.weeks[w-1].eff); const done=prev.filter(r=>M.cEntries.some(c=>c.w===w-1&&c.s===r.s&&c.i===r.i&&c.g!==null));

  else out.push(["Carnet semaine précédente","✓ Première semaine"]);
  return out;
}

function setPath(obj,path,val){ const ks=path.split("."); let o=obj;
  for(let i=0;i<ks.length-1;i++){ const k=ks[i],nk=ks[i+1]; if(o[k]===undefined||o[k]===null) o[k]=/^\d+$/.test(nk)?[]:{}; o=o[k]; }
  const last=ks[ks.length-1]; if(val===""||val===undefined||val===null){ if(Array.isArray(o)) o[last]=null; else delete o[last]; } else o[last]=val; }
function getPath(obj,path){ return path.split(".").reduce((o,k)=>o==null?undefined:o[k],obj); }
document.addEventListener("change",e=>{ const el=e.target;
  if(el.dataset.k&&coach()){ let v=el.type==="checkbox"?el.checked:el.value;
    if(el.dataset.t==="n"&&v!==""){ v=String(v).replace(",","."); v=isNaN(+v)?v:+v; }
    setPath(ST.prog,el.dataset.k,v); saveProg(); render(); return; }
  if(el.dataset.c){ const k=el.dataset.c,f=el.dataset.f; ST.carnet[k]=Object.assign({},ST.carnet[k]); let v=el.value; if(f!=="j"&&v!==""){ v=String(v).replace(",","."); v=isNaN(+v)?v:+v; }
    if(v==="") delete ST.carnet[k][f]; else ST.carnet[k][f]=v; saveCarnet(k); render(); return; }
  if(el.dataset.sv){ const w=el.dataset.sv,f=el.dataset.f; ST.suivi[w]=Object.assign({},ST.suivi[w]); let v=el.value; v=v===""?null:+String(v).replace(",",".");
    if(v===null) delete ST.suivi[w][f]; else ST.suivi[w][f]=v; saveSuivi(w); render(); return; }
  if(el.dataset.ui){ const k=el.dataset.ui; const v=el.value; if(k.startsWith("sim.")) ST.sim[k.slice(4)]=v; else ST[k]=v; render(); } });
document.addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act,v=b.dataset.v;

function chart(title,labels,bars,lines,opt={}){
  const Wd=340,Hd=170,pl=30,pr=opt.right?30:8,pt=10,pb=26,iw=Wd-pl-pr,ih=Hd-pt-pb,n=labels.length;
  const vals=a=>a.filter(v=>v!==null&&v!==undefined&&!isNaN(v));
  const leftAll=[...bars.flatMap(b=>vals(b.v)),...lines.filter(l=>!l.right).flatMap(l=>vals(l.v))];
  const lmax=Math.max(1,...leftAll)*1.1; const rAll=lines.filter(l=>l.right).flatMap(l=>vals(l.v)); const rmin=opt.rmin??0; const rmax=rAll.length?Math.max(...rAll)*1.05:1;
  const x=i=>pl+iw*(i+0.5)/n, yl=v=>pt+ih-ih*v/lmax, yr=v=>pt+ih-ih*(v-rmin)/Math.max(1e-9,rmax-rmin);
  let s=`<svg viewBox="0 0 ${Wd} ${Hd}" width="100%" role="img" aria-label="${esc(title)}">`;
  for(let g=0;g<=4;g++){ const y=pt+ih*g/4; s+=`<line x1="${pl}" x2="${Wd-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="0.6"/>`; s+=`<text x="${pl-4}" y="${y+3}" font-size="8" text-anchor="end" fill="var(--soft)">${fmtN(round(lmax*(1-g/4),lmax<10?1:0))}</text>`;
    if(opt.right) s+=`<text x="${Wd-pr+4}" y="${y+3}" font-size="8" fill="var(--soft)">${opt.rfmt?opt.rfmt(rmin+(rmax-rmin)*(1-g/4)):fmtN(round(rmin+(rmax-rmin)*(1-g/4),1))}</text>`; }
  const bw=iw/n*0.7/Math.max(1,bars.length);
  bars.forEach((b,bi)=>b.v.forEach((v,i)=>{ if(v==null||isNaN(v)) return; const y=yl(v); s+=`<rect x="${x(i)-iw/n*0.35+bi*bw}" y="${y}" width="${bw}" height="${pt+ih-y}" fill="${b.c}" rx="1.5"/>`; }));
  lines.forEach(l=>{ let d=""; l.v.forEach((v,i)=>{ if(v==null||isNaN(v)) return; const y=l.right?yr(v):yl(v); d+=(d?"L":"M")+x(i).toFixed(1)+","+y.toFixed(1); });
    if(d) s+=`<path d="${d}" fill="none" stroke="${l.c}" stroke-width="2" ${l.dash?'stroke-dasharray="4 3"':""}/>`; });
  labels.forEach((t,i)=>{ if(n>14&&i%2) return; s+=`<text x="${x(i)}" y="${Hd-12}" font-size="8" text-anchor="middle" fill="var(--soft)">${esc(t)}</text>`; });
  s+="</svg>"; const leg=[...bars.map(b=>[b.c,b.n]),...lines.map(l=>[l.c,l.n])].map(([c,n])=>`<span class="chip"><span class="plate" style="--pc:${c}"></span>${esc(n)}</span>`).join("");
  return `<div class="card"><h3>${esc(title)}</h3>${s}<div>${leg}</div></div>`; }

  pq:"",iq:"",dq:"",xq:"",lq:"",fq:"",saveT:null,lib:"plats",dDraft:null,fNew:null,shopDays:7,shop:{}};

const r0=x=>Math.round(+x||0);
const fmtE=x=>(Math.round((+x||0)*100)/100).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const isoD=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const todayISO=()=>isoD(new Date());
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return isoD(d);};
const addMonths=(iso,n)=>{const d=new Date(iso+"T12:00:00");const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return isoD(d);};

const frDay=iso=>new Date(iso+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});

const DSH=["L","M","M","J","V","S","D"], DLONG=["lun.","mar.","mer.","jeu.","ven.","sam.","dim."];
const nrm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const Z=()=>({k:0,p:0,g:0,l:0});
const addM=(a,b)=>({k:a.k+b.k,p:a.p+b.p,g:a.g+b.g,l:a.l+b.l});
const macTxt=m=>`${r0(m.k)} kcal · P ${r0(m.p)} · G ${r0(m.g)} · L ${r0(m.l)}`;

// ---------- calculs nutrition
function fSnap(f,q){ return {n:f.name,q:+q,k:+f.kcal,p:+f.p,g:+f.g,l:+f.l,u:f.unit||null,ug:f.unit_g?+f.unit_g:null,c:f.cat||""}; }
function dishSnap(d){ return {n:d.name,m:1,it:(d.items||[]).map(i=>{const f=NU.fmap[i.f]; return f?fSnap(f,i.q):null;}).filter(Boolean)}; }
function mac(its,m=1){ const t=Z(); (its||[]).forEach(i=>{ const x=(+i.q||0)*m/100; t.k+=x*(+i.k||0); t.p+=x*(+i.p||0); t.g+=x*(+i.g||0); t.l+=x*(+i.l||0); }); return t; }
const optMac=o=>o?mac(o.it,o.m||1):Z();
const dishMac=d=>mac(dishSnap(d).it);
const dayPlan=t=>((t&&t.meals)||[]).reduce((s,m)=>addM(s,optMac(m.opts&&m.opts[0])),Z());
function qtyTxt(i,m=1){ let q=(+i.q||0)*m; q=q>=50?Math.round(q/5)*5:Math.round(q);
  if(i.ug&&i.u){ const n=q/i.ug, nr=Math.round(n*2)/2; if(nr>0&&nr<=12&&Math.abs(n-nr)<0.1){ const pl=nr>1&&!/[sx]$/.test(i.u)&&!i.u.includes(" ")?"s":""; return `${fmtN(nr)} ${i.u}${pl} · ${q} g`; } }
  return q+" g"; }
function fSearch(q,n=12){ const w=nrm(q).split(/\s+/).filter(Boolean); if(!w.length||!NU.foods) return []; return NU.foods.filter(f=>{const t=nrm(f.name+" "+(f.cat||""));return w.every(x=>t.includes(x));}).slice(0,n); }

function nDayCtx(){ const d=NU.day||todayISO(), L=NU.logs[d]||{}, P=planOn(), t=P&&P.types.length?typeOf(L.t||P.week[DOW(d)]):null; return {d,L,t,P}; }
function consumed(L){ let s=Z(); Object.values(L.m||{}).forEach(x=>{ if(x&&x.mac) s=addM(s,x.mac); }); (L.x||[]).forEach(e=>s=addM(s,mac([e]))); return s; }
function nPlanClient(){ const P=planOn(); let h=""; if(!P) return `<div class="card muted">Pas encore de plan.</div>`;
  h+=`<div class="row noprint" style="justify-content:flex-end"><button class="ghost sm" data-act="pr-nut">Plan en PDF</button></div>`;
  P.types.filter(t=>t.meals.some(m=>m.opts.length)).forEach(t=>{ const days=P.week.map((id,i)=>id===t.id?DLONG[i]:null).filter(Boolean).join(", ");
    h+=`<div class="card"><h3 style="margin-top:0">${esc(t.name)}</h3><div class="muted small">${days||"aucun jour"} · ${macTxt(dayPlan(t))}</div>`;
    t.meals.forEach(m=>{ h+=`<details style="margin-top:8px"><summary>${esc(m.name)}${m.opts[0]?` · ${esc(m.opts[0].n)}`:""}</summary>${m.opts.map((o,oi)=>`<div class="edit"><div class="row"><span class="tag ${oi?"alt":""}">${oi?"Option "+(oi+1):"Prévu"}</span><b class="grow">${esc(o.n)}</b><span class="muted small">${r0(optMac(o).k)} kcal</span></div>${itemsList(o)}</div>`).join("")||'<div class="muted small">Rien de prévu.</div>'}</details>`; });
    h+=`</div>`; });
  if((P.cardio||[]).length||P.steps) h+=`<div class="card"><h3 style="margin-top:0">Cardio & activité</h3>${P.steps?`<p>Objectif : ${fmtN(+P.steps)} pas par jour</p>`:""}${(P.cardio||[]).map(c=>`<div class="opt"><b>${cardTxt(c)}</b><div class="small">${(c.days||[]).map((x,i)=>x?DLONG[i]:null).filter(Boolean).join(", ")||"jours à définir"} · objectif ${+c.k||cardK(c,latestWeight())} kcal machine${c.fc?` · FC ${esc(c.fc)}`:""}</div>${c.note?`<div class="muted small">${esc(c.note)}</div>`:""}</div>`).join("")}</div>`;
  if(P.notes) h+=`<div class="card"><h3 style="margin-top:0">Consignes</h3><div style="white-space:pre-wrap">${esc(P.notes)}</div></div>`;
  if(P.supp) h+=`<div class="card"><h3 style="margin-top:0">Compléments</h3><div style="white-space:pre-wrap">${esc(P.supp)}</div></div>`;
  return h; }

function nCourses(){ const P=coach()?NU.plan:planOn(), agg={}; if(!P) return `<div class="card muted">Pas encore de plan.</div>`;
  P.week.forEach(id=>{ typeOf(id).meals.forEach(m=>{ const o=m.opts[0]; if(!o) return; o.it.forEach(i=>{ const k=i.n; if(!agg[k]) agg[k]={...i,q:0}; agg[k].q+=(+i.q||0)*(o.m||1); }); }); });
  const f=NU.shopDays/7, groups={}; Object.values(agg).forEach(i=>{ const c=i.c||"Divers"; (groups[c]=groups[c]||[]).push({...i,q:i.q*f}); });
  let h=subnav([[3,"3 jours"],[7,"7 jours"],[14,"14 jours"]].map(([v,l])=>[String(v),l]),String(NU.shopDays),"nu-shopd");
  h+=`<p class="note">Basé sur les plats prévus. Coche ce que tu as déjà.</p>`;
  Object.keys(groups).sort().forEach(c=>{ h+=`<div class="card"><h3 style="margin-top:0">${esc(c)}</h3>${groups[c].sort((a,b)=>a.n.localeCompare(b.n)).map(i=>{ const on=!!NU.shop[i.n];
    return `<label class="row shop ${on?"got":""}" style="padding:6px 0;border-top:1px solid var(--line)"><input type="checkbox" style="width:auto" data-shop="${esc(i.n)}" ${on?"checked":""}><span class="grow">${esc(i.n)}</span><span class="muted">${qtyTxt(i)}</span></label>`; }).join("")}</div>`; });
  if(!Object.keys(groups).length) h+=`<div class="card muted">La liste se remplit dès que des plats sont prévus.</div>`;
  if(Object.keys(NU.shop).length) h+=`<button class="ghost" data-act="nu-shopclr">Tout décocher</button>`;
  return h; }

function cardK(c,w){ const m=(MACH.find(x=>x[0]===c.mach)||MACH[MACH.length-1])[1]*intOf(c.int)[2]; return Math.round(m*w*(+c.dur||0)/60/5)*5; }

function nCardioCoach(){ const P=NU.plan, w=latestWeight(), C=P.cardio||(P.cardio=[]); let wk=0, ns=0;

function spark2(pts,label){ const W=340,H=130,px=26,py=18; const ys=pts.map(p=>p[1]); let y0=Math.min(...ys),y1=Math.max(...ys); if(y1-y0<1){y0-=0.5;y1+=0.5;}
  const X=i=>px+(pts.length===1?0:i/(pts.length-1))*(W-2*px), Y=y=>H-py-(y-y0)/(y1-y0)*(H-2*py-6);
  const step=Math.ceil(pts.length/6);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(label)}"><polyline fill="none" stroke="var(--blue)" stroke-width="2.5" points="${pts.map((p,i)=>X(i)+","+Y(p[1])).join(" ")}"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p[1])}" r="3.5" fill="var(--blue)"/>${(i%step===0||i===pts.length-1)?`<text x="${X(i)}" y="${Y(p[1])-8}" font-size="11" text-anchor="middle" fill="var(--ink)">${fmtN(p[1])}</text><text x="${X(i)}" y="${H-2}" font-size="10" text-anchor="middle" fill="var(--soft)">${p[0]}</text>`:""}`).join("")}</svg>`; }

function weekStats(){ const P=planOn(); const days=[...Array(7)].map((_,i)=>addDays(todayISO(),-i)); let meals=0,ok=0,kc=0,pk=0,nk=0,nd=0,cp=0,cd=0; const st=[],sh=[],hu=[],sr=[],en=[];

    cd+=Object.keys(L.c||{}).length; if(L.steps) st.push(+L.steps); if(r.sh) sh.push(+r.sh); if(r.hu) hu.push(r.hu); if(r.st) sr.push(r.st); if(r.en) en.push(r.en); });

function tgtOf(t){ const T=NU.plan&&NU.plan.tgt; if(!T) return null; const g=(t&&t.g!=null&&t.g!=="")?+t.g:+T.g; return {p:+T.p,l:+T.l,g,k:4*(+T.p)+4*g+9*(+T.l)}; }
function grpOf(i){ if((+i.k||0)<50&&(+i.l||0)<3) return "x"; const P=4*(+i.p||0),G=4*(+i.g||0),L=9*(+i.l||0); return P>=G&&P>=L?"p":L>=G?"l":"g"; }
function fitItems(opts,tg){ // opts: liste d'options dont on ajuste les quantités, tg {p,g,l}
  opts.forEach(o=>{ const m=o.m||1; o.it.forEach(i=>i.q=(+i.q||0)*m); o.m=1; o.it.forEach(i=>i.q0=i.q); });
  const all=opts.flatMap(o=>o.it);
  for(let it=0;it<60;it++){ const tot={p:0,g:0,l:0}; all.forEach(i=>{ tot.p+=i.q*(+i.p||0)/100; tot.g+=i.q*(+i.g||0)/100; tot.l+=i.q*(+i.l||0)/100; });
    ["p","l","g"].forEach(X=>{ const grp=all.filter(i=>grpOf(i)===X); const c=grp.reduce((s,i)=>s+i.q*(+i[X]||0)/100,0); if(c<=0) return;
      const f=Math.max(0.6,Math.min(1.6,1+(tg[X]-tot[X])/c)); grp.forEach(i=>{ i.q=Math.max(i.q0*0.2,Math.min(i.q0*3.5,i.q*f)); }); tot.p=0;tot.g=0;tot.l=0; all.forEach(i=>{ tot.p+=i.q*(+i.p||0)/100; tot.g+=i.q*(+i.g||0)/100; tot.l+=i.q*(+i.l||0)/100; }); }); }
  all.forEach(i=>{ i.q=i.q>=50?Math.round(i.q/5)*5:Math.max(1,Math.round(i.q)); delete i.q0; }); }
function fitType(t){ const tt=tgtOf(t); if(!tt) return null; const mains=t.meals.map(m=>m.opts[0]).filter(Boolean); fitItems(mains,tt);
  t.meals.forEach(m=>{ const o0=m.opts[0]; if(!o0) return; const ref=optMac(o0); m.opts.slice(1).forEach(o=>fitItems([o],{p:ref.p,g:ref.g,l:ref.l})); });
  return {got:dayPlan(t),tt}; }

async function compressImg(file,max=1600,q=0.8){ if(!/^image\/(jpeg|png|webp)/.test(file.type)) return file;
  const img=await new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=URL.createObjectURL(file); });
  const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return await new Promise(ok=>c.toBlob(b=>ok(b||file),"image/jpeg",q)); }
async function uploadMedia(file){ if(!CUR) return null; const isV=/^video\//.test(file.type)||/\.(mov|mp4|m4v|webm)$/i.test(file.name||""); if(isV&&file.size>50*1024*1024){ MSG.err="Vidéo trop lourde (50 Mo max) : filme un clip plus court ou en 720p."; toast(MSG.err); return null; }
  const blob=isV?file:await compressImg(file); const ext=isV?((file.name.split(".").pop()||"mp4").toLowerCase()):"jpg"; const path=`${CUR}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await SB.storage.from("media").upload(path,blob,{contentType:isV?(file.type||"video/mp4"):"image/jpeg",upsert:false});
  if(error){ MSG.err="Envoi impossible : "+error.message; toast(MSG.err); return null; } return {path,type:isV?"video":"image"}; }
async function compressVideo(file,onp){ if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream) throw new Error("no recorder");
  const mime=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"].find(m=>{ try{ return MediaRecorder.isTypeSupported(m); }catch(e){ return false; } }); if(!mime) throw new Error("no mime");
  const url=URL.createObjectURL(file); const v=document.createElement("video"); v.src=url; v.muted=true; v.playsInline=true; v.setAttribute("playsinline",""); v.style.cssText="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none"; document.body.appendChild(v);
  try{ await new Promise((ok,ko)=>{ v.onloadedmetadata=ok; v.onerror=()=>ko(new Error("lecture impossible")); setTimeout(()=>ko(new Error("timeout")),15000); });
    const sc=Math.min(1,720/Math.max(1,Math.min(v.videoWidth,v.videoHeight))); const W=Math.round(v.videoWidth*sc/2)*2, H=Math.round(v.videoHeight*sc/2)*2;
    const c=document.createElement("canvas"); c.width=W; c.height=H; const ctx=c.getContext("2d"); const rec=new MediaRecorder(c.captureStream(30),{mimeType:mime,videoBitsPerSecond:2500000}); const chunks=[];
    rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); }; const stopped=new Promise(ok=>rec.onstop=ok);
    ctx.drawImage(v,0,0,W,H); rec.start(1000); await v.play();
    await new Promise(ok=>{ const draw=()=>{ if(v.ended){ ok(); return; } ctx.drawImage(v,0,0,W,H); if(onp&&v.duration) onp(Math.min(1,v.currentTime/v.duration)); requestAnimationFrame(draw); }; v.onended=ok; draw(); });
    rec.stop(); await stopped; const type=mime.split(";")[0]; const out=new File([new Blob(chunks,{type})],"video."+(type.includes("mp4")?"mp4":"webm"),{type});
    if(!out.size) throw new Error("vide"); return out; }
  finally{ URL.revokeObjectURL(url); v.remove(); } }

function trainProposal(d){ const n=Math.max(2,Math.min(6,parseInt(d.n_ses)||3)), yrs=d.years||"", lieu=d.lieu==="À la maison"?"Maison":"Salle";
  const level=yrs==="Moins d'1 an"?"Débutant":yrs==="Plus de 5 ans"?"Avancé":"Intermédiaire";
  const DEF={2:[true,false,false,true,false,false,false],3:DAYS3,4:DAYS4,5:[true,true,true,true,true,false,false],6:DAYS6};
  let days=Array.isArray(d.days)&&d.days.some(Boolean)?d.days.map(Boolean):null;
  if(days){ const on=days.map((v,i)=>v?i:-1).filter(i=>i>=0); if(on.length>n){ const keep=new Set(Array.from({length:n},(_,j)=>on[Math.round(j*(on.length-1)/Math.max(1,n-1))])); days=days.map((v,i)=>keep.has(i)); } }
  if(!days||days.filter(Boolean).length<Math.min(n,2)) days=DEF[n].slice();
  const nd=days.filter(Boolean).length, dmax={"45 min":45,"60 min":60,"75 min":75,"90 min ou plus":90}[d.dur]||75, equip=Array.isArray(d.equipL)?d.equipL.filter(x=>EQUIP.includes(x)):[];
  const prio=(Array.isArray(d.prio)?d.prio:[]).map(l=>(PRIO14.find(x=>x[0]===l)||[])[1]).filter(Boolean).slice(0,3);
  let bank=null, why="";
  if(lieu==="Maison"){ bank=equip.some(x=>x==="Haltères"||x==="Élastiques")?"home1":"home0"; why="entraînement à la maison"; }
  else if(level==="Débutant"&&nd<=3){ bank="fb3"; why="débutant, 3 séances ou moins"; }
  else if(d.obj==="Gagner en force"){ bank=nd>=4?"pl4":null; why=nd>=4?"objectif force, 4 séances":"objectif force, moins de 4 séances : programme généré sur mesure"; }
  else if(d.obj==="Améliorer ma composition corporelle"){ bank=nd>=6?"ppl6":nd>=4?"pb4":"fb3"; why="objectif composition corporelle, "+nd+" séances"; }
  else if(d.obj==="Retrouver de l'énergie et de la forme"){ bank=nd>=4?"pb4":"fb3"; why="objectif forme, "+nd+" séances"; }
  else { bank=null; why="échéance ou objectif spécifique : programme généré sur mesure"; }
  const b=bank&&BANK.find(x=>x.id===bank);
  return {level,days,nd,dmax,dmin:Math.max(30,dmax-30),lieu,equip,prio,pdc:parseFloat(String(d.weight||"").replace(",","."))||null,bank:b,why}; }

// ---------- proposition alimentaire
const nrmW=s=>nrm(s||"").replace(/œ/g,"oe").replace(/æ/g,"ae").replace(/[^a-z0-9 ]+/g," ");
function foodFlags(f){ const n=nrm(f.name).replace(/œ/g,"oe"), c=f.cat||"", F={};
  if(c==="Volailles & viandes"||c==="Charcuterie") F.meat=1;
  if(/porc|lardon|bacon|chorizo|saucisse|saucisson|rillettes|coppa|mortadelle|jambon(?!.*dinde)|pate de campagne/.test(n)) F.pork=1,F.meat=1;
  if(/crevette|gambas|moule|crabe|calamar|saint-jacques|huitre|poulpe|surimi/.test(n)) F.sea=1;
  else if(c==="Poissons & fruits de mer") F.fish=1;
  if(c==="Fromages"||(c==="Produits laitiers"&&!/soja|amande|avoine|coco|sans lactose/.test(n))||/^beurre( demi| allege|$)|creme fraiche|creme liquide|whey|caseine|tzatziki|pesto|parmesan|gainer|pancakes proteines|barre proteinee|granola/.test(n)) F.dairy=1;
  if(c==="Œufs"||/oeuf|pancakes proteines/.test(n)) F.egg=1;
  if(/pates|pain|wrap|tortilla de ble|boulgour|couscous|semoule|epeautre|bagel|flocons d.avoine|son d.avoine|muesli|granola|seitan|pita|orge|nouilles aux oeufs|sauce soja|biscotte|farine|crepe|pancake|barre proteinee|naan|galette de sarrasin|boisson avoine/.test(n)) F.gluten=1;
  if(/^miel/.test(n)) F.honey=1;
  return F; }
function dishOK(dsh,d){ const fl={}; const names=[nrmW(dsh.name)];
  (dsh.items||[]).forEach(i=>{ const f=NU.fmap[i.f]; if(!f) return; Object.assign(fl,foodFlags(f)); names.push(nrmW(f.name)); });
  const diet=d.diet||"Omnivore", ex=Array.isArray(d.excl)?d.excl:[];
  if(diet.startsWith("Pescétarien")&&fl.meat) return false;
  if(diet==="Végétarien"&&(fl.meat||fl.fish||fl.sea)) return false;
  if(diet==="Vegan"&&(fl.meat||fl.fish||fl.sea||fl.dairy||fl.egg||fl.honey)) return false;
  if(ex.includes("Sans lactose")&&fl.dairy) return false; if(ex.includes("Sans gluten")&&fl.gluten) return false; if(ex.includes("Sans porc")&&fl.pork) return false;
  if(ex.includes("Sans poisson")&&fl.fish) return false; if(ex.includes("Sans fruits de mer")&&fl.sea) return false;
  const bad=String(d.dislike||"").split(/[,;\n]+/).map(w=>nrmW(w).trim()).filter(w=>w.length>=3);
  if(bad.some(w=>names.some(n=>n.includes(w)||n.includes(w.replace(/s$/,""))))) return false;
  return true; }
const seedSort=(arr,seed)=>arr.map(x=>{ let h=0; const s=seed+x.name; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return [h,x]; }).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function nutriProposal(d,T){ const w=parseFloat(String(d.weight||"").replace(",","."))||null, h=parseFloat(String(d.height||"").replace(",","."))||null, age=parseInt(d.age)||null;
  const adj={"Perdre du gras":-20,"Perdre du gras en douceur":-12,"Maintenir / recomposition":0,"Prendre du muscle":8}[d.nobj]; const neat={"Plutôt assis":1.35,"Mixte":1.5,"Plutôt debout ou actif":1.65}[d.activity]||1.35;
  const meals=d.meals==="3 repas"?["Petit-déjeuner","Déjeuner","Dîner"]:d.meals==="3 repas + 2 collations"?["Petit-déjeuner","Collation","Déjeuner","Collation","Dîner"]:["Petit-déjeuner","Déjeuner","Collation","Dîner"];
  const pool=c=>seedSort((NU.dishes||[]).filter(x=>x.cat===c&&dishOK(x,d)),CUR||"");
  const R=pool("Repas"), C=pool("Collation"), P0=pool("Petit-déjeuner"), P=P0.length>=2?P0:[...P0,...C.filter(x=>!P0.includes(x))];
  const missing=[!w&&"poids",!h&&"taille",!age&&"âge",!d.sex&&"sexe",adj===undefined&&"objectif alimentaire"].filter(Boolean);
  return {prof:{sex:d.sex==="Femme"?"F":"H",age:age||undefined,h:h||undefined,w:w||undefined,neat,ses:T.nd,dur:T.dmax,adj:adj??0},meals,P,R,C,missing}; }
function applyNutri(N,T){ const plan=blankNut(); plan.prof=Object.assign({},N.prof); Object.keys(plan.prof).forEach(k=>plan.prof[k]===undefined&&delete plan.prof[k]);

function effData(){ const NS=M.NSEM, add0=t=>sysAdd(t,M.pdc), W=[]; for(let w=1;w<=NS;w++) W.push({w,ton:0,sets:0,plan:0,intS:0,intN:0,rpeS:0,rpeN:0,mov:{},mus:{}});
  const loadOf=(g,type)=>type==="Haltères"?2*g:type==="Lesté"?g+M.pdc:g;
  const addSet=(o,name,type,x)=>{ if(!x.d) return; const g=num(x.g), h=num(x.h), rp=num(x.r); o.sets++; const mP=(BASEMAP[name]||{}).mP; if(mP) o.mus[mP]=(o.mus[mP]||0)+1;
    const m=o.mov[name]=o.mov[name]||{ton:0,best:0,sets:0}; m.sets++;
    if(g!=null&&h!=null){ const ld=loadOf(g,type)*h; o.ton+=ld; m.ton+=ld; const sys=sysOf(g,h,rp,add0(type)); if(sys) m.best=Math.max(m.best,sys-add0(type));
      const t=M.trackedByName[name]; if(t&&t.est){ o.intS+=(g+add0(type))/((t.work&&t.work[o.w])||t.est); o.intN++; } }
    if(rp!=null){ o.rpeS+=rp; o.rpeN++; } };
  Object.entries(ST.carnet).forEach(([k,v])=>{ const m=k.match(/^(\d+)_(\d+)_(\d+)$/); const hm=k.match(/^(\d+)_h_(\d+)$/); const w=+(m||hm||[])[1]; const o=W[w-1]; if(!o||!v) return;
    if(m){ const r=rowAt(m[2],m[3]); if(!r) return; const name=v.ex||r.ex; if(!name) return; const type=typeOfName(name,r); setsOf(v).forEach(x=>addSet(o,name,type,x)); }
    else (v.list||[]).forEach(x=>{ const type=typeOfName(x.ex); (x.sets||[]).forEach(s=>addSet(o,x.ex,type,s)); }); });
  M.rows.forEach(r=>{ for(let w=1;w<=NS;w++){ const k=r.weeks[w]; if(r.ex&&k&&k.eff) W[w-1].plan+=planSets(k).length; } });
  return W; }

function mLine(series,unit){ const W=170,H=90,p=14; const all=series.flatMap(s=>s.pts); if(all.length<2) return "";

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${series.map(s=>`<polyline fill="none" stroke="${s.c}" stroke-width="2" ${s.dash?'stroke-dasharray="4 3"':""} points="${s.pts.map(q=>X(new Date(q[0]).getTime()).toFixed(1)+","+Y(q[1]).toFixed(1)).join(" ")}"/>`).join("")}
    <text x="2" y="10" font-size="9" fill="var(--soft)">${fmtN(round(y1,1))} ${unit}</text><text x="2" y="${H-2}" font-size="9" fill="var(--soft)">${fmtN(round(y0,1))}</text></svg>`; }

// ================= MODULE PAS PAR JOUR PRÉCIS (besoins nutritionnels) =================
// Le nombre de pas saisi au clavier est converti en coefficient d'activité sur la même échelle que le menu
// (≈ 3 000 pas → 1,2 · 6 500 → 1,35 · 10 000 → 1,5 · 14 000 → 1,65, puis +0,0375 par 1 000 pas, plafonné à 2,0).
function neatFromSteps(s){ s=+s; if(!(s>0)) return null; const A=[[3000,1.2],[6500,1.35],[10000,1.5],[14000,1.65]];
  if(s<=A[0][0]) return 1.2; for(let i=1;i<A.length;i++) if(s<=A[i][0]){ const [x0,y0]=A[i-1],[x1,y1]=A[i]; return y0+(s-x0)*(y1-y0)/(x1-x0); }
  return Math.min(2,1.65+(s-14000)*0.0000375); }
const _nBesoins18=nBesoins;
nBesoins=function(){ const P=NU.plan, f=P.prof||(P.prof={}), nf=neatFromSteps(f.steps); const saved=f.neat;
  if(nf) f.neat=nf; let h; try{ h=_nBesoins18(); } finally{ if(nf){ if(saved===undefined) delete f.neat; else f.neat=saved; } }
  const inp=`<label class="f" style="flex-basis:100%;margin-top:6px">Ou nombre de pas précis par jour (au clavier)<input data-nk="prof.steps" data-t="n" inputmode="numeric" value="${esc(f.steps??"")}" placeholder="ex. 17000"></label>${nf?`<div class="muted small" style="flex-basis:100%">${fmtN(+f.steps)} pas/jour → coefficient d'activité ${fmtN(round(nf,2))} (remplace le choix du menu). Efface le nombre pour revenir au menu.</div>`:""}`;
  return h.replace(/(<label class="f" style="flex-basis:100%">Activité hors séances[\s\S]*?<\/select><\/label>)/,`$1${inp}`)
    .replace(/(Activité hors séances)(<select[^>]*>)/,nf?`$1 <span class="chip">pas précis utilisés</span>$2<option value="" selected disabled>Remplacé par le nombre de pas précis</option>`:"$1$2"); };

// ================= MODULE CALORIES COHÉRENTES AVEC LES MACROS =================
// Les objectifs sont calculés avec 4 kcal/g (protéines, glucides) et 9 kcal/g (lipides). Les aliments affichaient
// leur énergie d'étiquette, qui compte aussi les fibres (≈ 2 kcal/g) : d'où des écarts de 50 à 100 kcal à macros égales.
// Désormais : kcal = 4 P + 4 G + 9 L, sauf pour les boissons alcoolisées et les estimations sans macros
// (énergie d'étiquette conservée quand les macros en expliquent moins de 60 %).
const kcalOf=i=>{ const lab=+i.k||0, atw=4*(+i.p||0)+4*(+i.g||0)+9*(+i.l||0); return lab>0&&atw<0.6*lab?lab:atw; };

document.addEventListener("click",e=>{ const b=e.target.closest('[data-act="x10-obsend"]'); if(!b||!X10.obDraft) return; if(obLite()) X10.obDraft._lite=1; else if(X10.obEdit) X10.obDraft._full=1; },true);

  return h.replace(`<div id="x10-pushnudge"></div>`,`<div class="card"><div class="muted small">Profil</div><h3 style="margin:2px 0">Complète ton profil (2 min)</h3><div class="muted small">Ton quotidien et tes préférences alimentaires aident ton coach à ajuster ton plan.</div><div class="row" style="margin-top:8px"><button class="ghost sm" data-act="ob-full">Compléter</button></div></div><div id="x10-pushnudge"></div>`); };

// Objectifs et Outils quittent la barre du bas : accessibles depuis l'Accueil (« Mes progrès ») et le Compte.
const _render44=render;

  tabs.querySelectorAll('[data-v="objectifs"],[data-v="outils"]').forEach(b=>b.remove());
  if(["objectifs","outils"].includes(ST.view)&&!ST.todayOn){ const c=tabs.querySelector('[data-v="compte"]'); if(c) c.classList.add("on"); } };
const _vToday44=vToday;
vToday=function(){ let h=_vToday44(); const R=typeof recordsAll==="function"?Object.values(recordsAll()):[], nNew=R.filter(e=>e.e1&&e.e1.w>=M.cw-1).length;
  return h.replace(`<div id="x10-pushnudge"></div>`,`<div class="card"><div class="muted small">Progrès</div><h3 style="margin:2px 0">📈 Mes progrès${nNew?` <span class="chip on">${nNew} record${nNew>1?"s":""} récent${nNew>1?"s":""}</span>`:""}</h3><div class="muted small">Records, objectifs de la phase et bilan de cycle.</div><div class="row" style="margin-top:8px"><button class="ghost sm" data-act="nav44" data-v="objectifs">Voir mes progrès</button></div></div><div id="x10-pushnudge"></div>`); };
const _x10After44=x10After;

// --- Mise en route (coach) : les étapes côté coach pour un client
function onbSteps(){ const P=ST.prog||{}, custom=(P.sessions||[]).some(s=>s&&s.ex&&s.ex.length), start=/^\d{4}-\d{2}-\d{2}$/.test((P.profile||{}).start||"");
  const plan=NU.cid===CUR&&NU.loaded?!!(NU.plan&&NU.plan.active!==false&&(NU.plan.types||[]).some(t=>t.meals.some(m=>m.opts.length))):null;
  const cyc=BZ.loaded?BZ.contracts.some(c=>c.client_id===CUR&&!c.archived):null;
  return [["Programme personnalisé",custom,"onb-go","programme","Banque de programmes"],["Date de début fixée",start,"onb-go","athlete","Régler"],
    ["Plan alimentaire visible",plan,"onb-go","nutrition","Suivi › Besoins puis Plan"],["Cycle et paiement créés",cyc,"onb-go","biz","Business"]]; }
function vOnboardCoach(){ if(!CUR||!ST.prog) return ""; let hide=null; try{ hide=localStorage.getItem("tb-onb-"+CUR); }catch(e){} if(hide) return "";
  if(!(NU.cid===CUR&&NU.loaded)&&ONB.nu!==CUR){ ONB.nu=CUR; nuEnsure().then(()=>scheduleRender()).catch(()=>{}); } if(!BZ.loaded) bzEnsure();
  const S=onbSteps(); if(S.every(s=>s[1]!==false)) return ""; const done=S.filter(s=>s[1]).length;
  return `<details class="card" id="onb-card" open><summary><b>🧭 Mise en route</b> <span class="chip on">${done}/${S.length}</span></summary>
    ${S.map(([l,ok,a,v,btn])=>`<div class="row" style="padding:6px 0;border-top:1px solid var(--line);flex-wrap:nowrap;gap:8px"><span style="width:22px">${ok?"✅":ok===null?"…":"⬜"}</span><span class="grow${ok?" muted":""}">${l}</span>${ok===false?`<button class="ghost sm" data-act="${a}" data-v="${v}">${btn}</button>`:""}</div>`).join("")}
    <div class="row" style="margin-top:6px"><button class="ghost sm" data-act="onb-hide">Masquer pour ce client</button></div></details>`; }
const ONB={nu:null};
const _x10After44b=x10After;
x10After=function(){ _x10After44b(); if(!(coach()&&ST.view==="tableau"&&CUR)) return; const h=vOnboardCoach(); if(!h) return; const ref=document.getElementById("act-card")||document.getElementById("rv-card"); if(ref) ref.insertAdjacentHTML("beforebegin",h); else $("#app").insertAdjacentHTML("afterbegin",h); };
document.addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act; if(a!=="onb-go"&&a!=="onb-hide") return; e.stopImmediatePropagation();
  if(a==="onb-hide"){ try{ localStorage.setItem("tb-onb-"+CUR,"1"); }catch(err){} return render(); }
  const v=b.dataset.v; if(v==="biz"){ CUR=null; M=null; ST.view="biz"; bzEnsure(); window.scrollTo(0,0); return render(); }
  ST.view=v; if(v==="nutrition") NU.nv="besoins"; if(v==="programme") ST.bankOpen=true; window.scrollTo(0,0); render(); },true);

boot();
