<body>
<p style="font-family:system-ui;padding:24px">L'ancien espace coach a été retiré. Redirection vers le nouvel espace…</p>
<p style="font-family:system-ui;padding:0 24px"><a href="../coach.html">Ouvrir le nouvel espace coach</a></p>
<script>
// Retire l'ancien service worker et son cache, puis va au nouvel espace (sans boucle si l'erreur survient)
(async () => {
  try {
    if ("serviceWorker" in navigator) { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r => r.unregister())); }
    if ("caches" in window) { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); }
  } catch (e) { /* on redirige quand même */ }
  location.replace("../coach.html");
})();
</script>
</body>
</html>
