name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la syntaxe du JavaScript de l'app
        run: |
          npx --yes esbuild@0.21.5 js/app.js --bundle --outfile=/tmp/app-check.js --format=esm --log-level=error
          node -e 'new Function(require("fs").readFileSync("sw.js","utf8"));console.log("syntaxe OK")'
      - name: Tester le moteur « Volume de la semaine »
        run: node --test tests/volume.test.mjs
      - name: Tester le moteur de régularité (score, alertes, rapport)
        run: node --test tests/adherence.test.mjs
      - name: Tester la bibliothèque d'exercices par pattern (données, filtres, alternatives)
        run: node --test tests/exercices.test.mjs
      - name: Tester le questionnaire « Mon programme sur mesure »
        run: node --test tests/programme.test.mjs
      - name: Tester le générateur de programme
        run: node --test tests/generateur.test.mjs
      - name: Tester l'indice de difficulté de la séance
        run: node --test tests/indice.test.mjs
      - name: Tester l'agenda « Ma semaine » (créneaux, récupération, imprévus)
        run: node --test tests/semaine.test.mjs
      - name: Tester le score de soutenabilité (ingrédients, version tenable, montée progressive)
        run: node --test tests/soutenabilite.test.mjs
      - name: Tester la récupération et la fatigue nerveuse (feu du jour, décharge, séance allégée)
        run: node --test tests/recuperation.test.mjs
      - name: Tester la roadmap vers un record
        run: node --test tests/roadmap.test.mjs
      - name: Tester l'atelier Créer mon programme
        run: node --test tests/atelier.test.mjs
      - name: Tester la détection des profils et le parcours reprise durable
        run: node --test tests/profils.test.mjs
      - name: Tester « Je craque » (réponses, déclencheurs, textes interdits)
        run: node --test tests/crise.test.mjs
      - name: Tester le genre choisi et les paliers adaptés au profil
        run: node --test tests/genre.test.mjs
      - name: Tester le moteur « athlète hybride » (blocs, volume, gabarits, zones, forme du jour)
        run: node --test tests/hybride.test.mjs
      - name: Tester les quêtes, l'XP, la série, les rangs, la génération et la fonction serveur du module hybride
        run: node --test tests/hybride-quetes.test.mjs tests/hybride-generation.test.mjs tests/hybride-serveur.test.mjs tests/armoire.test.mjs
      - name: Tester les règles d'accès SQL du module hybride (Postgres local, aucune connexion à la production)
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -qc "create role $USER superuser login"
          PGHOST=/var/run/postgresql PGDATABASE=postgres tests/sql/run-hybride.sh
      - name: Tester le partage, le parrainage et la communauté (liens, filtre anti-contacts, paliers, jeu) et la récompense du webhook Stripe
        run: node --test tests/social.test.mjs tests/parrainage-webhook.test.mjs
      - name: Tester les règles d'accès SQL de la communauté et du parrainage (Postgres local, aucune connexion à la production)
        run: PGHOST=/var/run/postgresql PGDATABASE=postgres tests/sql/run-social.sh
      - name: Tester les quantités naturelles, la quantité habituelle et la semaine nutrition en anneaux
        run: node --test tests/portions.test.mjs tests/nutri-semaine.test.mjs tests/anneaux-seances.test.mjs tests/double-progression.test.mjs tests/bilan-reglages.test.mjs tests/recap.test.mjs tests/reseau.test.mjs tests/revue.test.mjs tests/cardio.test.mjs tests/sante.test.mjs tests/factures.test.mjs tests/video-calc.test.mjs tests/stats-realise.test.mjs tests/envoi-programme.test.mjs tests/activite-calc.test.mjs tests/douleur.test.mjs
      - name: Tester la liste hors ligne du service worker (modules réellement chargés)
        run: node --test tests/sw.test.mjs
      - name: Vérifier que la messagerie n'écrit plus dans l'ancienne table
        run: node --test tests/messagerie.test.mjs
      - name: Installer les outils de test
        working-directory: tests
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Lancer les tests de bout en bout
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tests/volume-e2e.js
          node tests/adherence-e2e.js
          node tests/exercices-e2e.js
          node tests/programme-e2e.js
          node tests/monplan-e2e.js
          node tests/indice-e2e.js
          node tests/semaine-e2e.js
          node tests/soutenabilite-e2e.js
          node tests/fatigue-e2e.js
          node tests/profils-e2e.js
          node tests/onboarding-sur-mesure-e2e.js
          node tests/atelier-e2e.js
          node tests/roadmap-e2e.js
          node tests/parcours-e2e.js
          node tests/crise-e2e.js
          node tests/genre-e2e.js
          node tests/hybride-e2e.js
          node tests/armoire-e2e.js
          node tests/social-e2e.js
          node tests/retours-client-e2e.js
          node tests/refonte-coach-e2e.js
          node tests/refonte-etape2-e2e.js
          node tests/etape3-e2e.js
          node tests/c72-e2e.js
        env:
          BASE_URL: http://localhost:8765/
