name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la syntaxe du JavaScript de l'app
        run: |
          npx --yes esbuild@0.21.5 js/app.js --bundle --outfile=/tmp/app-check.js --format=esm --log-level=error
          node -e 'new Function(require("fs").readFileSync("sw.js","utf8"));console.log("syntaxe OK")'
      - name: Tester le moteur « Volume de la semaine »
        run: node --test tests/volume.test.mjs
      - name: Tester le moteur de régularité (score, alertes, rapport)
        run: node --test tests/adherence.test.mjs
      - name: Tester la bibliothèque d'exercices par pattern (données, filtres, alternatives)
        run: node --test tests/exercices.test.mjs
      - name: Tester le questionnaire « Mon programme sur mesure »
        run: node --test tests/programme.test.mjs
      - name: Tester le générateur de programme
        run: node --test tests/generateur.test.mjs
      - name: Tester l'indice de difficulté de la séance
        run: node --test tests/indice.test.mjs
      - name: Tester l'agenda « Ma semaine » (créneaux, récupération, imprévus)
        run: node --test tests/semaine.test.mjs
      - name: Installer les outils de test
        working-directory: tests
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Lancer les tests de bout en bout
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tests/volume-e2e.js
          node tests/adherence-e2e.js
          node tests/exercices-e2e.js
          node tests/programme-e2e.js
          node tests/monplan-e2e.js
          node tests/indice-e2e.js
          node tests/semaine-e2e.js
          node tests/run.js
        env:
          BASE_URL: http://localhost:8765/
