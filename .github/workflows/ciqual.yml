name: Table Ciqual
# Régénère data/ciqual.json depuis la table officielle ANSES (lancement manuel ou modification du script).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/ciqual.py, .github/workflows/ciqual.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install xlrd==2.0.1
      - run: python tools/ciqual.py
      - name: Enregistrer le fichier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ciqual.json
          git diff --cached --quiet || (git commit -m "Table Ciqual : data/ciqual.json régénéré" && git pull --rebase origin main && git push)
